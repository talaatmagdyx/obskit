[project]
name = "obskit-tracing"
version = "2.2.0"
description = "Distributed tracing for obskit via OpenTelemetry"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Talaat Magdy", email = "talaatmagdy75@gmail.com" },
]
keywords = ["observability", "metrics", "tracing", "logging", "prometheus", "opentelemetry", "microservices"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "obskit-core>=2.0.0",
]

[project.optional-dependencies]
# Core OTel SDK + OTLP exporter (required for any real tracing)
opentelemetry = [
    "opentelemetry-api>=1.20.0,<2.0.0",
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.20.0,<2.0.0",
]
# Per-library auto-instrumentation packages (install only what you need)
fastapi    = ["opentelemetry-instrumentation-fastapi>=0.41b0"]
sqlalchemy = ["opentelemetry-instrumentation-sqlalchemy>=0.41b0"]
redis      = ["opentelemetry-instrumentation-redis>=0.41b0"]
httpx      = ["opentelemetry-instrumentation-httpx>=0.41b0"]
celery     = ["opentelemetry-instrumentation-celery>=0.41b0"]
django     = ["opentelemetry-instrumentation-django>=0.41b0"]
requests   = ["opentelemetry-instrumentation-requests>=0.41b0"]
grpc       = ["opentelemetry-instrumentation-grpc>=0.41b0"]
aiopika    = ["opentelemetry-instrumentation-aio-pika>=0.41b0"]
# Kitchen-sink: all auto-instrumentation extras in one go
auto = [
    "obskit-tracing[opentelemetry,fastapi,sqlalchemy,redis,httpx,celery,django,requests,grpc,aiopika]",
]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0,<2.0.0",
    "ruff>=0.3.0,<1.0.0",
    "opentelemetry-api>=1.20.0,<2.0.0",
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.20.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
obskit-core = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/obskit --cov-report=term-missing --import-mode=importlib"

[tool.coverage.run]
source = ["src/obskit"]
branch = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
