[project]
name = "obskit-core"
version = "2.0.0"
description = "Core utilities for the obskit observability toolkit: correlation, config, errors, interfaces, test helpers, and namespace root"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Talaat Magdy", email = "talaatmagdy75@gmail.com" },
]
keywords = ["observability", "metrics", "tracing", "logging", "prometheus", "opentelemetry", "microservices", "testing", "mocks"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "structlog>=23.1.0,<26.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0,<2.0.0",
    "ruff>=0.3.0,<1.0.0",
    "prometheus-client>=0.19.0,<1.0.0",
    "opentelemetry-api>=1.20.0,<2.0.0",
    "jsonschema>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/talaatmagdyx/obskit"
Repository = "https://github.com/talaatmagdyx/obskit.git"
Issues = "https://github.com/talaatmagdyx/obskit/issues"
Changelog = "https://github.com/talaatmagdyx/obskit/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/obskit --cov-report=term-missing --import-mode=importlib"

[tool.coverage.run]
source = ["src/obskit"]
branch = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
