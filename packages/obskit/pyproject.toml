[project]
name = "obskit"
version = "2.2.0"
description = "Production-ready observability toolkit for Python microservices — meta-package"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Talaat Magdy", email = "talaatmagdy75@gmail.com" },
]
keywords = ["observability", "metrics", "logging", "tracing", "microservices", "monitoring"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "obskit-core>=2.0.0",
    "obskit-logging>=2.0.0",
    "obskit-metrics>=2.0.0",
    "obskit-slo>=2.0.0",
    "obskit-resilience>=2.0.0",
    "obskit-health>=2.0.0",
    "obskit-tracing>=2.0.0",
    "obskit-decorators>=2.0.0",
    "obskit-db>=2.0.0",
    "obskit-queue>=2.0.0",
    "obskit-dashboards>=2.0.0",
]

[project.optional-dependencies]
middleware = [
    "obskit-middleware-fastapi>=2.0.0",
    "obskit-middleware-flask>=2.0.0",
    "obskit-middleware-django>=2.0.0",
    "obskit-middleware-grpc>=2.0.0",
]
all = [
    "obskit[middleware]",
]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0,<2.0.0",
    "ruff>=0.3.0,<1.0.0",
    "prometheus-client>=0.19.0,<1.0.0",
    "opentelemetry-api>=1.20.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/talaatmagdyx/obskit"
Repository = "https://github.com/talaatmagdyx/obskit.git"
Issues = "https://github.com/talaatmagdyx/obskit/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
obskit-core = { workspace = true }
obskit-dashboards = { workspace = true }
obskit-db = { workspace = true }
obskit-decorators = { workspace = true }
obskit-health = { workspace = true }
obskit-logging = { workspace = true }
obskit-metrics = { workspace = true }
obskit-middleware-django = { workspace = true }
obskit-middleware-fastapi = { workspace = true }
obskit-middleware-flask = { workspace = true }
obskit-middleware-grpc = { workspace = true }
obskit-queue = { workspace = true }
obskit-resilience = { workspace = true }
obskit-slo = { workspace = true }
obskit-tracing = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --import-mode=importlib"
