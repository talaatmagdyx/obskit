[project]
name = "obskit-queue"
version = "2.0.0"
description = "Kafka and RabbitMQ message queue tracing and instrumentation for obskit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Talaat Magdy", email = "talaatmagdy75@gmail.com" },
]
keywords = ["observability", "metrics", "kafka", "rabbitmq", "queue", "tracing", "microservices"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "obskit-core>=2.0.0",
    "obskit-logging>=2.0.0",
    "obskit-metrics>=2.0.0",
]

[project.optional-dependencies]
kafka = ["kafka-python>=2.0.0,<3.0.0"]
rabbitmq = ["pika>=1.3.0,<2.0.0"]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0,<2.0.0",
    "ruff>=0.3.0,<1.0.0",
    "prometheus-client>=0.19.0,<1.0.0",
    "opentelemetry-api>=1.20.0,<2.0.0",
    "pika>=1.3.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/talaatmagdyx/obskit"
Repository = "https://github.com/talaatmagdyx/obskit.git"
Issues = "https://github.com/talaatmagdyx/obskit/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
obskit-core = { workspace = true }
obskit-logging = { workspace = true }
obskit-metrics = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/obskit --cov-report=term-missing --import-mode=importlib"

[tool.coverage.run]
source = ["src/obskit"]
branch = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
