# Release Please - Automated releases and changelogs
# https://github.com/google-github-actions/release-please-action
#
# This workflow:
# 1. Creates/updates a Release PR with changelog
# 2. When merged, creates GitHub release and tags
# 3. Triggers the release.yml workflow for PyPI publishing

name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Release Please
        id: release
        uses: google-github-actions/release-please-action@v4
        with:
          release-type: python
          package-name: obskit
          # Changelog sections
          changelog-types: |
            [
              {"type": "feat", "section": "🚀 Features", "hidden": false},
              {"type": "fix", "section": "🐛 Bug Fixes", "hidden": false},
              {"type": "perf", "section": "⚡ Performance", "hidden": false},
              {"type": "docs", "section": "📚 Documentation", "hidden": false},
              {"type": "refactor", "section": "♻️ Refactoring", "hidden": false},
              {"type": "test", "section": "✅ Tests", "hidden": false},
              {"type": "build", "section": "📦 Build", "hidden": false},
              {"type": "ci", "section": "🔧 CI/CD", "hidden": false},
              {"type": "chore", "section": "🧹 Chores", "hidden": true}
            ]
          # Extra files to update version in
          extra-files: |
            pyproject.toml
            src/obskit/_version.py

  # Trigger PyPI release when a new release is created
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    secrets: inherit

