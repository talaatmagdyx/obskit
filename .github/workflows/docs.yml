name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/**/*.py'
      - 'README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/**/*.py'
      - 'README.md'

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # MkDocs — primary documentation (Material theme + mkdocstrings)
  # ---------------------------------------------------------------------------
  build-mkdocs:
    name: Build MkDocs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for mike version tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install obskit + all extras + dev tools (includes mkdocs)
        run: uv sync --all-extras

      - name: Build MkDocs site (strict mode — fail on warnings)
        run: uv run mkdocs build --strict --site-dir site/

      - name: Upload MkDocs site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # ---------------------------------------------------------------------------
  # Deploy MkDocs to GitHub Pages (main branch only)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy MkDocs to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-mkdocs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
