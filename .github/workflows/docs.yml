name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'packages/*/src/**/*.py'
      - 'packages/*/README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'packages/*/src/**/*.py'
      - 'packages/*/README.md'

permissions:
  contents: write   # needed for mike versioning commits
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # MkDocs — primary documentation (Material theme + mkdocstrings)
  # ---------------------------------------------------------------------------
  build-mkdocs:
    name: Build MkDocs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for mike version tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install all obskit packages (for mkdocstrings API extraction)
        run: |
          python -m pip install --upgrade pip
          pip install \
            -e packages/obskit-core \
            -e packages/obskit-logging \
            -e packages/obskit-metrics \
            -e packages/obskit-tracing \
            -e packages/obskit-health \
            -e packages/obskit-resilience \
            -e packages/obskit-slo \
            -e packages/obskit-middleware-fastapi \
            -e packages/obskit-middleware-flask \
            -e packages/obskit-middleware-django \
            -e packages/obskit-middleware-grpc \
            -e "packages/obskit[all]"

      - name: Install MkDocs + plugins
        run: |
          pip install \
            mkdocs>=1.6.0 \
            mkdocs-material>=9.5.0 \
            mkdocstrings[python]>=0.25.0 \
            mike>=2.0.0

      - name: Build MkDocs site (strict mode — fail on warnings)
        run: mkdocs build --strict --site-dir site/

      - name: Upload MkDocs site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # ---------------------------------------------------------------------------
  # Sphinx — legacy API reference (kept for backward compat)
  # ---------------------------------------------------------------------------
  build-sphinx:
    name: Build Sphinx (legacy)
    runs-on: ubuntu-latest
    # Only run Sphinx if its source files changed
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Sphinx dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -e packages/obskit-core \
            -e packages/obskit-logging \
            -e packages/obskit-metrics \
            -e packages/obskit-tracing \
            -e packages/obskit-health \
            sphinx>=7.0.0 \
            sphinx-rtd-theme \
            myst-parser \
            sphinxcontrib-httpdomain \
            furo || true   # soft-fail if extra deps missing

      - name: Build Sphinx docs
        run: |
          if [ -f docs/source/conf.py ]; then
            cd docs && make html 2>&1 | tail -20
          else
            echo "No Sphinx conf.py found — skipping"
          fi
        continue-on-error: true   # don't fail CI on legacy Sphinx issues

      - name: Upload Sphinx artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html
          path: docs/_build/html/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Deploy MkDocs to GitHub Pages (main branch only)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy MkDocs to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-mkdocs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
