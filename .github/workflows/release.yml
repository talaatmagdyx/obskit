name: Release

on:
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: "Version being published (e.g. 2.2.0) — informational only"
        required: false
        default: ""

jobs:
  build:
    name: Build obskit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build obskit
        run: python -m build

      - name: Check obskit
        run: twine check dist/*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-obskit
          path: dist/

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write   # needed to upload release assets (SBOM)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install obskit + SBOM tool
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" cyclonedx-bom

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --outfile sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Attach SBOM to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: sbom.json

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, sbom]
    permissions:
      id-token: write   # needed for OIDC PyPI publish and Sigstore signing
      contents: write   # needed to upload Sigstore signatures to release
    environment:
      name: pypi
      url: https://pypi.org/project/obskit/

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-obskit
          path: dist/

      - name: Publish obskit to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Sign release artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3
        with:
          inputs: dist/*.whl dist/*.tar.gz

      - name: Upload Sigstore signatures to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.sigstore.json

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' && github.event.release.prerelease == true
    permissions:
      id-token: write   # needed for OIDC TestPyPI publish
    environment:
      name: testpypi
      url: https://test.pypi.org/project/obskit/

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-obskit
          path: dist/

      - name: Publish obskit to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
