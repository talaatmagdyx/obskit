name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

jobs:
  test:
    name: Test ${{ matrix.package }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        package:
          - obskit-core
          - obskit-logging
          - obskit-metrics
          - obskit-tracing
          - obskit-health
          - obskit-resilience
          - obskit-slo
          - obskit-middleware-fastapi
          - obskit-middleware-flask
          - obskit-middleware-django
          - obskit-middleware-grpc
          - obskit-decorators
          - obskit-db
          - obskit-queue
          - obskit-dashboards
          - obskit

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install workspace (all packages + all extras)
        run: uv sync --all-packages --all-extras

      - name: Run tests for ${{ matrix.package }}
        run: uv run pytest packages/${{ matrix.package }}/tests/ -q --tb=short --no-cov --timeout=30 --benchmark-disable

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run ruff check
        run: uv run ruff check packages/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install workspace (all packages + all extras)
        run: uv sync --all-packages --all-extras

      - name: Run mypy on core packages
        run: |
          uv run mypy packages/obskit-core/src/
          MYPYPATH=packages/obskit-logging/src uv run mypy packages/obskit-logging/src/
          MYPYPATH=packages/obskit-metrics/src uv run mypy packages/obskit-metrics/src/
          MYPYPATH=packages/obskit-tracing/src uv run mypy packages/obskit-tracing/src/

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install workspace (all packages + all extras)
        run: uv sync --all-packages --all-extras

      - name: Run integration tests (no containers)
        run: uv run pytest tests/integration/ -q --tb=short -m "not integration"
