name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test ${{ matrix.package }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        package:
          - obskit-core
          - obskit-logging
          - obskit-metrics
          - obskit-tracing
          - obskit-health
          - obskit-resilience
          - obskit-slo
          - obskit-middleware-fastapi
          - obskit-middleware-flask
          - obskit-middleware-django
          - obskit-middleware-grpc
          - obskit

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install all packages in editable mode
        run: |
          pip install --upgrade pip
          pip install \
            -e packages/obskit-core \
            -e packages/obskit-logging \
            -e packages/obskit-metrics \
            -e packages/obskit-tracing \
            -e packages/obskit-health \
            -e packages/obskit-resilience \
            -e packages/obskit-slo \
            -e packages/obskit-decorators \
            -e packages/obskit-db \
            -e packages/obskit-queue \
            -e packages/obskit-dashboards \
            -e packages/obskit-middleware-fastapi \
            -e packages/obskit-middleware-flask \
            -e packages/obskit-middleware-django \
            -e packages/obskit-middleware-grpc \
            -e packages/obskit

      - name: Install dev dependencies for ${{ matrix.package }}
        run: pip install -e "packages/${{ matrix.package }}[dev]"

      - name: Run tests for ${{ matrix.package }}
        run: pytest packages/${{ matrix.package }}/tests/ -q --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff>=0.3.0

      - name: Run ruff check
        run: ruff check packages/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages + mypy
        run: |
          pip install --upgrade pip
          pip install \
            -e packages/obskit-core \
            -e packages/obskit-logging \
            -e packages/obskit-metrics \
            -e packages/obskit-tracing \
            -e packages/obskit-health \
            -e packages/obskit-resilience \
            -e packages/obskit-slo \
            -e packages/obskit-decorators \
            -e packages/obskit-db \
            -e packages/obskit-queue \
            -e packages/obskit-dashboards \
            -e packages/obskit-middleware-fastapi \
            -e packages/obskit-middleware-flask \
            -e packages/obskit-middleware-django \
            -e packages/obskit-middleware-grpc \
            -e packages/obskit
          pip install mypy>=1.8.0

      - name: Run mypy on core packages
        run: |
          mypy packages/obskit-core/src/
          mypy packages/obskit-logging/src/
          mypy packages/obskit-metrics/src/
          mypy packages/obskit-tracing/src/

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install all packages
        run: |
          pip install --upgrade pip
          pip install \
            -e packages/obskit-core \
            -e packages/obskit-logging \
            -e packages/obskit-metrics \
            -e packages/obskit-tracing \
            -e packages/obskit-health \
            -e packages/obskit-resilience \
            -e packages/obskit-slo \
            -e packages/obskit-decorators \
            -e packages/obskit-db \
            -e packages/obskit-queue \
            -e packages/obskit-dashboards \
            -e packages/obskit-middleware-fastapi \
            -e packages/obskit-middleware-flask \
            -e packages/obskit-middleware-django \
            -e packages/obskit-middleware-grpc \
            -e packages/obskit
          pip install pytest pytest-asyncio pytest-cov httpx fastapi starlette flask

      - name: Run integration tests (no containers)
        run: pytest tests/integration/ -q --tb=short -m "not integration"
