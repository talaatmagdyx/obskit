name: Mutation Testing

on:
  # Run weekly — mutation tests are slow (~10-30 min)
  schedule:
    - cron: "0 2 * * 6"  # Saturday 02:00 UTC
  workflow_dispatch:
    inputs:
      module:
        description: "Module to mutate (default: all v2 modules)"
        required: false
        default: "all"

jobs:
  mutmut:
    name: mutmut — ${{ matrix.module }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: tracer
            path: src/obskit/tracing/tracer.py
            tests: tests/unit/tracing
          - module: trace_correlation
            path: src/obskit/logging/trace_correlation.py
            tests: tests/unit/logging
          - module: exemplar
            path: src/obskit/metrics/exemplar.py
            tests: tests/unit/metrics
          - module: health_checker
            path: src/obskit/health/checker.py
            tests: tests/unit/health
          - module: circuit_breaker
            path: src/obskit/resilience/circuit_breaker.py
            tests: tests/unit/resilience
          - module: slo_tracker
            path: src/obskit/slo/tracker.py
            tests: tests/unit/slo
          - module: red_metrics
            path: src/obskit/metrics/red.py
            tests: tests/unit/metrics
          - module: alert_rule
            path: src/obskit/alerts/rule.py
            tests: tests/unit/alerts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install obskit + mutmut
        run: |
          pip install --upgrade pip
          pip install -e ".[all]"
          pip install mutmut pytest pytest-asyncio

      - name: Run mutmut on ${{ matrix.module }}
        run: |
          mutmut run \
            --paths-to-mutate "${{ matrix.path }}" \
            --runner "python -m pytest ${{ matrix.tests }} -x -q --no-header --tb=no" \
            --no-progress || true

      - name: Show mutation results
        run: |
          mutmut results
          SURVIVED=$(mutmut results | grep -c "survived" || true)
          echo "Survived mutants: $SURVIVED"
          if [[ "$SURVIVED" -gt 5 ]]; then
            echo "❌ Too many survived mutants ($SURVIVED). Add more targeted tests."
            exit 1
          fi
          echo "✅ Mutation score acceptable"

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-${{ matrix.module }}
          path: .mutmut-cache/
