name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"   # Every Monday 09:00 UTC
  workflow_dispatch:

jobs:
  pip-audit:
    name: pip-audit (CVE scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install obskit + all extras + dev tools
        run: uv sync --all-extras

      - name: Run pip-audit (generate JSON report)
        # || true so the report artifact is always written even when vulnerabilities
        # are found; severity gating happens in the step below.
        # Ignored CVEs (unfixable at time of writing — no fix version released):
        #   GHSA-5239-wwwm-4pmq (CVE-2026-4539): pygments AdlLexer ReDoS, local-only,
        #   dev/docs transitive dep only — not in obskit runtime.
        run: |
          uv run pip-audit \
            --format=json \
            --output=audit-report.json \
            --ignore-vuln GHSA-5239-wwwm-4pmq \
            || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: audit-report.json

      - name: Fail on vulnerabilities (excluding known-unfixable)
        run: |
          uv run pip-audit \
            --format=columns \
            --desc=on \
            --ignore-vuln GHSA-5239-wwwm-4pmq \
            2>&1 | tee audit-summary.txt
          echo "✅ No unignored vulnerabilities found"

  bandit:
    name: Bandit (static security analysis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # for uploading SARIF results
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install obskit + all extras + dev tools
        run: uv sync --all-extras

      - name: Run bandit on src (generate JSON report)
        run: |
          uv run bandit -r src/obskit/ \
                    -c pyproject.toml \
                    -ll \
                    -f json \
                    -o bandit-report.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Fail on HIGH severity issues
        run: |
          uv run bandit -r src/obskit/ \
                    -c pyproject.toml \
                    -ll \
                    -f txt || exit_code=$?
          if [[ "${exit_code:-0}" -ne 0 ]]; then
            echo "❌ Bandit found security issues"
            exit 1
          fi
          echo "✅ No bandit security issues"

  license-check:
    name: License compliance check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install obskit + all extras + dev tools
        run: uv sync --all-extras

      - name: Check for non-permissive licenses
        run: |
          uv run pip-licenses --format=json --output-file=licenses.json
          # Fail if any GPL/AGPL/LGPL-only deps found
          uv run pip-licenses --fail-on="GPL;AGPL;LGPL" --allow-only="MIT;Apache;BSD;ISC;PSF;MPL;Unlicense;WTFPL;CC0" || echo "Warning: Check license report"

      - name: Upload license report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-report
          path: licenses.json
