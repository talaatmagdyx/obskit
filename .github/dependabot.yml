version: 2
updates:
  # Python production dependencies — daily so security patches land quickly
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 15
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
    # Auto-group low-risk dev/test tooling to reduce noise
    groups:
      dev-tooling:
        patterns:
          - "pytest*"
          - "mypy"
          - "ruff"
          - "pre-commit"
          - "bandit*"
          - "pip-audit"
          - "pip-licenses"
          - "safety"
          - "cyclonedx*"
          - "sigstore"
          - "types-*"
          - "asciinema"
        update-types:
          - "minor"
          - "patch"
      docs-dependencies:
        patterns:
          - "sphinx*"
          - "furo"
          - "myst-parser"
        update-types:
          - "minor"
          - "patch"
    # Never auto-group core production deps — each gets its own PR
    # so security advisories are clearly visible
    ignore: []

  # GitHub Actions — weekly is fine; pin to commit SHAs for supply-chain safety
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
