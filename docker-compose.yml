# =============================================================================
# obskit Docker Compose Configuration
# Development, testing, and documentation services
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Development environment
  # ---------------------------------------------------------------------------
  dev:
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
    working_dir: /app
    stdin_open: true
    tty: true
    command: bash

  # ---------------------------------------------------------------------------
  # Run tests
  # ---------------------------------------------------------------------------
  test:
    build:
      context: .
      target: test
    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
    command: pytest tests/ -v --cov=src/obskit --cov-report=term-missing --cov-report=html:htmlcov

  # ---------------------------------------------------------------------------
  # Run tests in parallel
  # ---------------------------------------------------------------------------
  test-parallel:
    build:
      context: .
      target: test
    volumes:
      - .:/app
    command: pytest tests/ -n auto -v --cov=src/obskit

  # ---------------------------------------------------------------------------
  # Type checking
  # ---------------------------------------------------------------------------
  typecheck:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    command: mypy src/obskit --strict

  # ---------------------------------------------------------------------------
  # Linting
  # ---------------------------------------------------------------------------
  lint:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    command: sh -c "ruff check src/ tests/ && ruff format --check src/ tests/"

  # ---------------------------------------------------------------------------
  # Documentation server with live reload
  # ---------------------------------------------------------------------------
  docs:
    build:
      context: .
      target: docs
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: sphinx-autobuild docs/source docs/_build/html --host 0.0.0.0 --port 8000

  # ---------------------------------------------------------------------------
  # Build documentation
  # ---------------------------------------------------------------------------
  docs-build:
    build:
      context: .
      target: docs
    volumes:
      - .:/app
    command: sphinx-build -b html docs/source docs/_build/html

  # ---------------------------------------------------------------------------
  # Supporting services for integration testing
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  # ---------------------------------------------------------------------------
  # Jaeger for tracing
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.52
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    profiles:
      - monitoring

  # ---------------------------------------------------------------------------
  # Grafana for visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.2
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # ---------------------------------------------------------------------------
  # Full CI pipeline
  # ---------------------------------------------------------------------------
  ci:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    command: >
      sh -c "
        echo '=== Running Linting ===' &&
        ruff check src/ tests/ &&
        ruff format --check src/ tests/ &&
        echo '=== Running Type Check ===' &&
        mypy src/obskit --strict &&
        echo '=== Running Tests ===' &&
        pytest tests/ -v --cov=src/obskit --cov-fail-under=100 &&
        echo '=== Building Docs ===' &&
        cd docs && make html &&
        echo '=== All checks passed! ==='
      "

volumes:
  pip-cache:
  prometheus-data:
  grafana-data:

