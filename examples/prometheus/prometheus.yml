# Prometheus Configuration for obskit Example Stack
# =================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'obskit-monitor'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load alerting rules
rule_files:
  - /etc/prometheus/alerts.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # Example obskit service
  - job_name: 'obskit-example'
    static_configs:
      - targets: ['app:9091']
    metrics_path: /metrics
    scrape_interval: 5s
    # Add service metadata
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'example-service'

  # Multiple services example (uncomment for multi-service setup)
  # - job_name: 'microservices'
  #   static_configs:
  #     - targets:
  #         - 'api-gateway:9090'
  #         - 'order-service:9091'
  #         - 'payment-service:9092'
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       regex: '(.+):(\d+)'
  #       target_label: service
  #       replacement: '${1}'

