    - Distributed Tracing: user-guide/tracing.md
    - Structured Logging: user-guide/logging.md
    - Health Checks: user-guide/health-checks.md
    - SLO Tracking: user-guide/slo.md
    - PII Redaction: user-guide/pii.md
    - Multi-Tenancy: user-guide/multi-tenancy.md

