[pytest]
# Test discovery
testpaths = tests packages
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum pytest version
minversion = 7.0

# Async mode
asyncio_mode = auto

# Default options (can be overridden with command line)
addopts =
    -v
    --tb=short
    --import-mode=importlib
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    stress: marks tests as stress/load tests

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Coverage settings (when using --cov)
# Run with: pytest --cov-config=.coveragerc --cov-report=term-missing
