[project]
name = "obskit"
version = "1.1.0"
description = "Production-ready observability toolkit for Python microservices"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Talaat Magdy", email = "talaatmagdy75@gmail.com" },
]
keywords = ["observability", "metrics", "tracing", "logging", "prometheus", "opentelemetry", "microservices", "monitoring"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

# Core dependencies (always installed)
dependencies = [
    "structlog>=23.1.0,<26.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/talaatmagdyx/obskit"
Repository = "https://github.com/talaatmagdyx/obskit.git"
Issues = "https://github.com/talaatmagdyx/obskit/issues"
Changelog = "https://github.com/talaatmagdyx/obskit/blob/main/CHANGELOG.md"
Documentation = "https://talaatmagdyx.github.io/obskit/"

[project.optional-dependencies]

# ── Observability backends ─────────────────────────────────────────────────
prometheus = ["prometheus-client>=0.19.0,<1.0.0"]
otlp = [
    "opentelemetry-api>=1.20.0,<2.0.0",
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0,<2.0.0",
]

# ── Framework middleware ───────────────────────────────────────────────────
fastapi = ["fastapi>=0.100.0,<1.0.0", "starlette>=0.27.0,<2.0.0"]
flask   = ["flask>=2.0.0,<4.0.0", "werkzeug>=2.0.0,<4.0.0"]
django  = ["django>=4.0.0,<6.0.0"]

# ── SLO tracking ──────────────────────────────────────────────────────────
slo            = []
slo-prometheus = ["prometheus-client>=0.19.0,<1.0.0"]
slo-all        = ["obskit[slo,slo-prometheus]"]

# ── Health checks ─────────────────────────────────────────────────────────
health      = []
health-http = ["httpx>=0.25.0,<1.0.0"]
health-all  = ["obskit[health,health-http]"]

# ── Database integrations ─────────────────────────────────────────────────
sqlalchemy = [
    "sqlalchemy>=2.0.0,<3.0.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
]
psycopg2 = [
    "psycopg2-binary>=2.7.3.1",
    "opentelemetry-instrumentation-psycopg2>=0.41b0",
]
psycopg3 = [
    "psycopg>=3.1.0",
    "opentelemetry-instrumentation-psycopg>=0.41b0",
]
db = ["obskit[sqlalchemy,psycopg2,psycopg3]"]

# ── Queue integrations ────────────────────────────────────────────────────
kafka    = ["kafka-python>=2.0.0,<3.0.0"]
rabbitmq = ["pika>=1.3.0,<2.0.0"]

# ── gRPC ──────────────────────────────────────────────────────────────────
grpc = ["grpcio>=1.50.0,<2.0.0"]

# ── Bundles ───────────────────────────────────────────────────────────────
integrations = ["obskit[db,kafka,rabbitmq,grpc]"]
all          = ["obskit[prometheus,otlp,fastapi,flask,django,slo-all,health-all,integrations]"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Development tools
# ---------------------------------------------------------------------------

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-benchmark>=4.0.0,<6.0.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0,<2.0.0",
    "ruff>=0.3.0,<1.0.0",
    "pre-commit>=3.6.0,<5.0.0",
    "bandit[toml]>=1.7.0,<2.0.0",
    "asciinema>=2.4.0,<3.0.0",
    "safety>=2.3.0,<4.0.0",
    "pip-audit>=2.6.0,<3.0.0",
    "pip-licenses>=5.0.0,<7.0.0",
    "cyclonedx-bom>=4.0.0,<6.0.0",
    "testcontainers[redis]>=4.0.0,<5.0.0",
    "httpx>=0.25.0,<1.0.0",
    "types-PyYAML>=6.0.0",
    "types-redis>=4.6.0",
    # All optional dependencies for testing
    "prometheus-client>=0.19.0,<1.0.0",
    "opentelemetry-api>=1.20.0,<2.0.0",
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.20.0,<2.0.0",
    "loguru>=0.7.0,<1.0.0",
    "fastapi>=0.100.0,<1.0.0",
    "starlette>=0.27.0,<2.0.0",
    "flask>=2.0.0,<4.0.0",
    "werkzeug>=2.0.0,<4.0.0",
    "django>=4.0.0,<6.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "pika>=1.3.0,<2.0.0",
    "redis>=5.0.0,<8.0.0",
    "psutil>=5.9.0",
    "aiohttp>=3.9.0",
    "jsonschema>=4.0.0",
    # Documentation build tools
    "mkdocs>=1.6.0,<2.0.0",
    "mkdocs-material>=9.5.0,<10.0.0",
    "mkdocstrings[python]>=0.25.0,<1.0.0",
    "mike>=2.0.0,<3.0.0",
    # Conventional commits / release tooling
    "commitizen>=3.0.0,<5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
addopts = "-v --cov=src/obskit --cov-report=term-missing --import-mode=importlib"
markers = [
    "core: core obskit functionality",
    "extended: extended modules (no external deps, niche features)",
    "experimental: experimental modules (API may change between minor releases)",
]

[tool.coverage.run]
source = ["src/obskit"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "if __name__ == .__main__.:",
]
partial_branches = [
    "pragma: no branch",
    "if not PROMETHEUS_AVAILABLE",
    "if not OPENTELEMETRY_AVAILABLE",
]
fail_under = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "obskit.middleware.base",
    "obskit.logging.sampling",
    "obskit.metrics.cardinality",
]
# Progressive type-safety: require explicit annotations but allow untyped calls
# (softer than ignore_errors=true, stricter than nothing — tackle module-by-module)
ignore_errors = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["obskit.integrations.db.psycopg2"]
# Psycopg2Instrumentor.instrument_connection() is untyped in some versions of
# opentelemetry-instrumentation-psycopg2; suppress across all mypy versions.
disallow_untyped_calls = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "E402",  # module level import not at top (needed for conditional imports)
]

[tool.ruff.lint.isort]
known-first-party = ["obskit"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ARG", "SIM", "F401", "F841", "B017", "B028", "B007", "C408", "C416", "E701", "E702", "W293", "I001"]
"**/__init__.py" = ["F401"]

[tool.bandit]
exclude_dirs = ["tests", "benchmarks"]
skips = ["B101"]

[tool.mutmut]
paths_to_mutate = """
src/obskit/tracing/tracer.py
src/obskit/logging/trace_correlation.py
src/obskit/metrics/exemplar.py
src/obskit/health/checker.py
"""
backup = false
runner = "python -m pytest tests/unit/tracing tests/unit/logging tests/unit/metrics tests/unit/health -x -q --no-header"
tests_dir = """
tests/unit/tracing
tests/unit/logging
tests/unit/metrics
tests/unit/health
"""
dict_synonyms = "Struct, NamedStruct"
