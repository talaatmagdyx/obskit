# obskit monorepo workspace root
#
# All packages live under packages/
#   Install everything:   pip install -e "packages/obskit[all]"
#   Install focused:      pip install -e packages/obskit-metrics
#   Install dev tools:    uv sync
#
# Packages (16 total):
#   obskit-core               – config, errors, interfaces, correlation, middleware base, test helpers
#   obskit-logging            – structured logging, adaptive sampling, debug
#   obskit-metrics            – RED/Golden/USE metrics, fingerprint, memory
#   obskit-tracing            – OpenTelemetry distributed tracing
#   obskit-health             – health-check framework
#   obskit-resilience         – circuit breaker, load shedding, failover
#   obskit-slo                – SLO/SLA tracking, alerting, budgets
#   obskit-decorators         – @observe, @trace cross-cutting decorators
#   obskit-db                 – SQLAlchemy instrumentation, query analyzer
#   obskit-queue              – Kafka/RabbitMQ tracing, consumer-lag, DLQ
#   obskit-dashboards         – Grafana dashboard generators
#   obskit-middleware-fastapi – FastAPI ASGI middleware
#   obskit-middleware-flask   – Flask WSGI middleware
#   obskit-middleware-django  – Django middleware
#   obskit-middleware-grpc    – gRPC server/client interceptors
#   obskit                    – meta-package (depends on all above)

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-benchmark>=4.0.0,<6.0.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0,<2.0.0",
    "ruff>=0.3.0,<1.0.0",
    "pre-commit>=3.6.0,<5.0.0",
    "bandit[toml]>=1.7.0,<2.0.0",
    "asciinema>=2.4.0,<3.0.0",
    "safety>=2.3.0,<4.0.0",
    "pip-audit>=2.6.0,<3.0.0",
    # License scanning
    "pip-licenses>=5.0.0,<7.0.0",
    # SBOM generation
    "cyclonedx-bom>=4.0.0,<6.0.0",
    # Release signing
    "sigstore>=3.0.0,<4.0.0",
    # Integration testing
    "testcontainers[redis]>=4.0.0,<5.0.0",
    "httpx>=0.25.0,<1.0.0",
    # Type stubs for mypy
    "types-PyYAML>=6.0.0",
    "types-redis>=4.6.0",
]

# ---------------------------------------------------------------------------
# Shared tool configuration (applies workspace-wide)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# These modules have incomplete annotations; relax strict rules until
# they are incrementally brought up to full type coverage.
module = [
    "obskit.testing.mocks",
    "obskit.testing.testcase",
    "obskit.testing.context",
    "obskit.cache",
    "obskit.cost",
    "obskit.business",
    "obskit.batch",
    "obskit.shutdown",
    "obskit.mixin",
    "obskit.middleware.base",
    "obskit.errors.responses",
    "obskit.correlation",
    "obskit.validation",
    "obskit.adaptive_sampling",
    "obskit.audit",
    "obskit.breakdown",
    "obskit.debug.replay",
    "obskit.executor",
    "obskit.logging.sampling",
    "obskit.pools",
    "obskit.annotations",
    "obskit.autoscaling",
    "obskit.dependency_graph",
    "obskit.fingerprint",
    "obskit.hot_path",
    "obskit.memory",
    "obskit.metrics.cardinality",
    "obskit.metrics.self_metrics",
    "obskit.metrics.tenant",
    "obskit.quota",
]
ignore_errors = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "E402",  # module level import not at top (needed for conditional imports)
]

[tool.ruff.lint.isort]
known-first-party = ["obskit"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ARG", "SIM", "F401", "F841", "B017", "B028", "B007", "C408", "C416", "E701", "E702", "W293", "I001"]  # Relaxed style rules in tests
"**/__init__.py" = ["F401"]    # Allow unused imports in __init__.py

[tool.bandit]
exclude_dirs = ["tests", "benchmarks"]
skips = ["B101"]  # Allow assert in tests

[tool.coverage.run]
source = ["packages"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "if __name__ == .__main__.:",
]
partial_branches = [
    "pragma: no branch",
    "if not PROMETHEUS_AVAILABLE",
    "if not OPENTELEMETRY_AVAILABLE",
]
fail_under = 100

# ---------------------------------------------------------------------------
# Mutation testing (mutmut)
# Run:  mutmut run --paths-to-mutate packages/obskit-tracing/src
#       mutmut results
# ---------------------------------------------------------------------------
[tool.mutmut]
# Focus on the new high-value modules added in v2.0
paths_to_mutate = """
packages/obskit-tracing/src/obskit/tracing/tracer.py
packages/obskit-logging/src/obskit/logging/trace_correlation.py
packages/obskit-metrics/src/obskit/metrics/exemplar.py
packages/obskit-health/src/obskit/health/checker.py
"""
backup = false
runner = "python -m pytest packages/obskit-tracing/tests packages/obskit-logging/tests packages/obskit-metrics/tests packages/obskit-health/tests -x -q --no-header"
tests_dir = """
packages/obskit-tracing/tests
packages/obskit-logging/tests
packages/obskit-metrics/tests
packages/obskit-health/tests
"""
dict_synonyms = "Struct, NamedStruct"
