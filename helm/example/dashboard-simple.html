<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>obskit - RED Metrics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }
        .header {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        h1 {
            color: #4ec9b0;
            margin-bottom: 10px;
        }
        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 10px;
        }
        .status.connected {
            background: #4caf50;
            color: white;
        }
        .status.disconnected {
            background: #f44336;
            color: white;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #4ec9b0;
        }
        .stat-label {
            font-size: 12px;
            color: #858585;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4ec9b0;
        }
        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .chart-card {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
        }
        .chart-title {
            color: #4ec9b0;
            margin-bottom: 15px;
            font-size: 16px;
        }
        canvas {
            max-height: 300px;
        }
        .refresh-btn {
            background: #4ec9b0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .refresh-btn:hover {
            background: #3ba899;
        }
        .auto-refresh {
            margin-left: 10px;
            color: #858585;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>obskit - RED Metrics Dashboard <span id="status" class="status disconnected">Disconnected</span></h1>
        <button class="refresh-btn" onclick="loadMetrics()">Refresh</button>
        <span class="auto-refresh">Auto-refresh: 30s</span>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">Total Requests</div>
            <div class="stat-value" id="total-requests">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Errors</div>
            <div class="stat-value" id="total-errors">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Error Rate</div>
            <div class="stat-value" id="error-rate">0%</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Avg Response Time</div>
            <div class="stat-value" id="avg-duration">0ms</div>
        </div>
    </div>

    <div class="charts">
        <div class="chart-card">
            <div class="chart-title">Request Rate (RPS)</div>
            <canvas id="request-rate-chart"></canvas>
        </div>
        <div class="chart-card">
            <div class="chart-title">Error Rate</div>
            <canvas id="error-rate-chart"></canvas>
        </div>
        <div class="chart-card">
            <div class="chart-title">Request Duration (p95, p99)</div>
            <canvas id="duration-chart"></canvas>
        </div>
        <div class="chart-card">
            <div class="chart-title">Requests by Operation</div>
            <canvas id="operation-chart"></canvas>
        </div>
    </div>

    <script>
        const METRICS_URL = 'http://localhost:9090/metrics';
        const SERVICE_NAME = 'order_service';
        
        let requestRateChart, errorRateChart, durationChart, operationChart;
        let requestRateData = [];
        let errorRateData = [];
        let durationData = [];
        let operationData = {};

        // Initialize charts
        function initCharts() {
            const chartOptions = {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { labels: { color: '#d4d4d4' } }
                },
                scales: {
                    x: { ticks: { color: '#858585' }, grid: { color: '#3d3d3d' } },
                    y: { ticks: { color: '#858585' }, grid: { color: '#3d3d3d' } }
                }
            };

            requestRateChart = new Chart(document.getElementById('request-rate-chart'), {
                type: 'line',
                data: { labels: [], datasets: [] },
                options: { ...chartOptions, plugins: { ...chartOptions.plugins, title: { display: true, text: 'Requests per Second', color: '#d4d4d4' } } }
            });

            errorRateChart = new Chart(document.getElementById('error-rate-chart'), {
                type: 'line',
                data: { labels: [], datasets: [] },
                options: { ...chartOptions, plugins: { ...chartOptions.plugins, title: { display: true, text: 'Errors per Second', color: '#d4d4d4' } } }
            });

            durationChart = new Chart(document.getElementById('duration-chart'), {
                type: 'line',
                data: { labels: [], datasets: [] },
                options: { ...chartOptions, plugins: { ...chartOptions.plugins, title: { display: true, text: 'Duration (seconds)', color: '#d4d4d4' } } }
            });

            operationChart = new Chart(document.getElementById('operation-chart'), {
                type: 'bar',
                data: { labels: [], datasets: [] },
                options: { ...chartOptions, plugins: { ...chartOptions.plugins, title: { display: true, text: 'Requests by Operation', color: '#d4d4d4' } } }
            });
        }

        // Parse Prometheus metrics
        function parseMetrics(text) {
            const lines = text.split('\n');
            const metrics = {};
            
            for (const line of lines) {
                if (line.startsWith('#') || !line.trim()) continue;
                
                const match = line.match(/^(\w+)(?:\{([^}]+)\})?\s+([\d.]+)/);
                if (match) {
                    const [, name, labels, value] = match;
                    const key = labels ? `${name}{${labels}}` : name;
                    metrics[key] = parseFloat(value);
                }
            }
            
            return metrics;
        }

        // Extract label value
        function getLabelValue(labels, labelName) {
            const match = labels.match(new RegExp(`${labelName}="([^"]+)"`));
            return match ? match[1] : 'unknown';
        }

        // Load and update metrics
        async function loadMetrics() {
            try {
                const response = await fetch(METRICS_URL);
                const text = await response.text();
                const metrics = parseMetrics(text);
                
                document.getElementById('status').textContent = 'Connected';
                document.getElementById('status').className = 'status connected';
                
                // Calculate stats
                let totalRequests = 0;
                let totalErrors = 0;
                let totalDuration = 0;
                let totalCount = 0;
                operationData = {};
                
                for (const [key, value] of Object.entries(metrics)) {
                    if (key.startsWith(`${SERVICE_NAME}_requests_total`)) {
                        totalRequests += value;
                        const operation = getLabelValue(key, 'operation');
                        if (!operationData[operation]) operationData[operation] = 0;
                        operationData[operation] += value;
                    }
                    if (key.startsWith(`${SERVICE_NAME}_errors_total`)) {
                        totalErrors += value;
                    }
                    if (key.includes('_sum') && key.includes('duration')) {
                        totalDuration += value;
                    }
                    if (key.includes('_count') && key.includes('duration')) {
                        totalCount += value;
                    }
                }
                
                const errorRate = totalRequests > 0 ? (totalErrors / totalRequests * 100).toFixed(2) : 0;
                const avgDuration = totalCount > 0 ? (totalDuration / totalCount * 1000).toFixed(2) : 0;
                
                // Update stats
                document.getElementById('total-requests').textContent = totalRequests.toLocaleString();
                document.getElementById('total-errors').textContent = totalErrors.toLocaleString();
                document.getElementById('error-rate').textContent = errorRate + '%';
                document.getElementById('avg-duration').textContent = avgDuration + 'ms';
                
                // Update charts (simplified - in real implementation, you'd track time series)
                const now = new Date().toLocaleTimeString();
                
                // Request rate chart
                if (requestRateChart.data.labels.length > 20) {
                    requestRateChart.data.labels.shift();
                    requestRateChart.data.datasets.forEach(dataset => dataset.data.shift());
                }
                requestRateChart.data.labels.push(now);
                if (!requestRateChart.data.datasets[0]) {
                    requestRateChart.data.datasets.push({
                        label: 'Requests/sec',
                        data: [],
                        borderColor: '#4ec9b0',
                        backgroundColor: 'rgba(78, 201, 176, 0.1)'
                    });
                }
                requestRateChart.data.datasets[0].data.push(totalRequests);
                requestRateChart.update('none');
                
                // Operation chart
                operationChart.data.labels = Object.keys(operationData);
                operationChart.data.datasets = [{
                    label: 'Requests',
                    data: Object.values(operationData),
                    backgroundColor: '#4ec9b0'
                }];
                operationChart.update();
                
            } catch (error) {
                document.getElementById('status').textContent = 'Error';
                document.getElementById('status').className = 'status disconnected';
                console.error('Error loading metrics:', error);
            }
        }

        // Initialize
        initCharts();
        loadMetrics();
        
        // Auto-refresh every 30 seconds
        setInterval(loadMetrics, 30000);
    </script>
</body>
</html>
