# Localhost Development Values
# ===========================
# Use this for local Kubernetes (minikube, kind, Docker Desktop)

replicaCount: 1

image:
  repository: localhost/order-service
  pullPolicy: IfNotPresent  # Use local images
  tag: "v1.0.0"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  metricsPort: 9090
  metricsPath: /metrics

ingress:
  enabled: false  # Disable ingress for localhost

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false  # Disable autoscaling for local

# obskit Configuration - Local Development
obskit:
  serviceName: "order-service"
  environment: "local"
  version: "v1.0.0"
  
  # Logging - Console format for local development
  logLevel: "DEBUG"
  logFormat: "console"  # Use console for readable logs
  logSampleRate: 1.0  # No sampling in local dev
  
  # Metrics - No auth needed locally
  metricsEnabled: true
  metricsPort: 9090
  metricsSampleRate: 1.0  # No sampling
  metricsAuthEnabled: false  # Disable auth for local
  
  # Tracing - Optional, can disable for local
  tracingEnabled: false
  # Or enable with local collector:
  # tracingEnabled: true
  # otlpEndpoint: "http://localhost:4317"
  # otlpInsecure: true
  # traceSampleRate: 1.0
  
  # Health Check
  healthCheckTimeout: 5.0

# Prometheus ServiceMonitor - Disable if not using Prometheus Operator
serviceMonitor:
  enabled: false

# Secrets - Minimal for local
secrets:
  metricsAuthToken: "local-dev-token"  # Not used if auth disabled

nodeSelector: {}

tolerations: []

affinity: {}

# Health Check Probes - Shorter timeouts for local
livenessProbe:
  httpGet:
    path: /live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 3
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3

# Additional Environment Variables
extraEnv: []

volumes: []
volumeMounts: []

