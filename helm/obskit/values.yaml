# Default values for obskit-service
# This is a YAML-formatted file.

replicaCount: 3

image:
  repository: your-registry/your-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  metricsPort: 9090
  metricsPath: /metrics

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# obskit Configuration
obskit:
  serviceName: "your-service"
  environment: "production"
  version: "1.0.0"
  
  # Logging
  logLevel: "INFO"
  logFormat: "json"
  logSampleRate: 0.1
  
  # Metrics
  metricsEnabled: true
  metricsPort: 9090
  metricsSampleRate: 0.1
  metricsAuthEnabled: true
  metricsAuthToken: ""  # Set via secret
  
  # Tracing
  tracingEnabled: true
  otlpEndpoint: "http://jaeger-collector:4317"
  traceSampleRate: 0.1
  otlpInsecure: false
  
  # Health Checks
  healthCheckTimeout: 5.0

# Prometheus ServiceMonitor
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  labels: {}

# Grafana Dashboard
grafana:
  dashboard:
    enabled: false
    namespace: ""  # Defaults to release namespace
    operator: false  # Set to true if using Grafana Operator

# Secrets
secrets:
  metricsAuthToken: ""
  # Add other secrets as needed

nodeSelector: {}

tolerations: []

affinity: {}

# Health Check Probes
livenessProbe:
  httpGet:
    path: /live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

